<!-- header html -->
<!DOCTYPE html>
<html lagn="ko" 
	  xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="headFragment">
   
    <header id="header">

	    <!-- logo -->
	    <h1 class="logo" id='plgo' style="width:215px;">
	        <img src="/common/img/big_logo.png" alt="" style="border: 0;"/>
	        <span class="blind" th:text="${session.MNGR_PJ_SESSION.mber_nm}">관리자</span></a>
	    </h1>
	
	   	<!-- top menu 처리  -->
	    <ul class="topmenu">
	    	
	    	<th:block th:each = "mngrTopMenu , i : ${session.FULL_MENU_LIST}">
	    		
	    		<!-- 메뉴 class on 변수처리 추가 25.06.24 -->
	    		<th:block th:with ="flag = ${mngrTopMenu.menu_code eq session._menu_code or (session._menu_code == null and i.index eq 0)} , styleClass=${flag == true ? 'on' : ''}">
	    	
	    		<!-- Top menus -->
	    		<th:block th:if="${#strings.substring(mngrTopMenu.menu_code,3,9) eq '000000'}">
	    			<li class='' th:classappend='${mngrTopMenu.menu_code}'>
			    		<a href="#" th:data-url="${mngrTopMenu['menu_url']}" 
			    		            th:data-code="${mngrTopMenu.menu_code}"
			    		            class='lgkTop' th:classappend="${styleClass}"
			            		    th:text="${mngrTopMenu.menu_code_nm}">${mngrTopMenu.menu_code}</a>
		           	</li>
				</th:block>	  
		   		
		   		<!-- 레프트 메뉴인 경우  -->
		   		<th:block th:unless="${#strings.substring(mngrTopMenu.menu_code,3,9) eq '000000'}">
		   			<li th:classappend='${mngrTopMenu.menu_code}' style='display:none;'>
			    		<a href="#" th:data-url="${mngrTopMenu['menu_url']}" 
			    		            th:data-code="${mngrTopMenu.menu_code}"
			    		            th:data-tup-code='${mngrTopMenu.upper_code}'
			    		            class='lgkTop' th:classappend="${styleClass}"
			            		    th:text="${mngrTopMenu.menu_code_nm}">${mngrTopMenu.menu_code}</a>
		            </li>
				</th:block>
				
			</th:block>
	    </ul>
	    <!-- //topmenu -->
	    
	    <form th:id = '_headForm' th:name = '_headForm' method = 'post'>
	    	<input type = 'hidden' th:id = '_menu_code' th:name = '_menu_code' th:value = '${session._menu_code}'/>
	    	<input type = 'hidden' th:id = '_left_code' th:name = '_left_code' th:value = '${session._left_code}'/>
	    	<input type = 'hidden' th:id = '_chld_code' th:name = '_chld_code' th:value = '${session._chld_code}'/>
	    </form>
	</header>
