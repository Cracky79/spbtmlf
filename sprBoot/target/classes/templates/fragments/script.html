<!DOCTYPE html>
<html lagn="ko" 
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="scriptFragment">

<!-- 공통 스크립트.-->
<config>

	<!--  message -->
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/toastr.min.css}" media="all">
	<!-- css -->
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/contents.css}" media="all">
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/etcadd.css}" media="all">
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/layout.css}" media="all">
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/table.css}" media="all">
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/added.css}" media="all">
	<link rel="stylesheet" th:href="@{/common/css/jquery-ui.min.css}" />
	<link rel="stylesheet" th:href="@{/common/css/pop.css}" />
	<link th:href="@{/common/css/common.css}"  rel="stylesheet" type="text/css"  media="all">
    <!-- DataTable -->
    <!-- <link rel="stylesheet" type="text/css" th:href="@{/common/css/bootstrap.min.css}" media="all">  -->
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/bootstrap-theme.min.css}" media="all">
	<link rel="stylesheet" type="text/css" th:href="@{/common/css/paging.css}" media="all">

    <!-- Bootstrap core JavaScript (상위 버전시 bug 발생  2021.05.25)-->
    <script th:src="@{/common/js/jquery.min.js}"></script>
    <script th:src="@{/common/js/bootstrap.min.js}"></script>
    <!-- Custom scripts for all pages-->
   <!--  <script th:src="@{/common/js/sb-admin-2.min.js}"></script> -->
 	<script th:src="@{/common/js/jTable.bootstrap.min.js}"></script>
	<script th:src="@{/common/js/jparam.min.js}"></script>
	<script th:src="@{/common/js/jcommon-validator.min.js}"></script>
	<script th:src="@{/common/js/bootstrap.min.js}"></script>
	<script th:src="@{/common/js/util.js}"></script>
	<!-- sha512 -->
	<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js}"></script>
	
	<script> 
	
		$(document).ready(function(){
			
			/***********************************************************************
			Top menu
			***********************************************************************/
			$('.lgkTop').bind('click' , function() {
			
				gfn_isSessionValid('mngr');		// 세션 체크 
				
				$('#_headForm #_menu_code').val($(this).attr('data-code'));
				$('#_headForm #_left_code').val('');						// top 메뉴 클릭시 기존 세션 제거를 위한 blank처리
				$('#_headForm #_chld_code').val('');
				
				if ( isNotEmpty ($(this).attr('data-url'))) {
					$('#_headForm').attr('action',$(this).attr('data-url')).submit(); 
				} else {
					/**  클릭시 url이 없는 경우  첫번째 요소의 url을 가져온다.  */
					const c_sel_cd = $('[data-tup-code="'+$(this).attr('data-code')+'"]:eq(0)');	/** 이동 해야 할 대상 메뉴 코드 추출 */
					if ( isNotEmpty(c_sel_cd.attr('data-url')) ) {		// 1depth인 경우 
						$('#_headForm #_left_code').val(c_sel_cd.attr('data-code'));						// top 메뉴 클릭시 기존 세션 제거를 위한 blank처리
						$('#_headForm #_chld_code').val('');
						$('#_headForm').attr('action',c_sel_cd.attr('data-url')).submit();
					} else {	// 접힘 메뉴 ( 2뎁스 인 경우 처리 )
						const c_anker = $('[data-tup-code="'+c_sel_cd.attr('data-code')+'"]:eq(0)');
						$('#_headForm #_left_code').val(c_sel_cd.attr('data-code'));						// top 메뉴 클릭시 기존 세션 제거를 위한 blank처리
						$('#_headForm #_chld_code').val(c_anker.attr('data-code'));
						$('#_headForm').attr('action',c_anker.attr('data-url')).submit();
					}
				}
			});
			
			// 레프트 1depth 메뉴
			$('.deth1').bind('click',function () {
				
				gfn_isSessionValid('mngr');		// 세션 체크 
				
				if ( !isNotEmpty ($(this).attr('data-url')) ) {
					return false;
				}
				$('#_headForm #_menu_code').val( $(this).attr('data-upper-code') );
				$('#_headForm #_left_code').val( $(this).attr('data-code') );
				$('#_headForm #_chld_code').val( '' );
				$('#_headForm').attr('action' , $(this).attr('data-url')).submit();
			});
			
			/***********************************************************************
			Left menu
			***********************************************************************/
			$('.deth2').bind('click',function () {
				
				if ( !isNotEmpty ($(this).attr('data-url')) ) {
					return false;
				}
				$('#_headForm #_menu_code').val( $(this).attr('data-upper-code') );
				$('#_headForm #_left_code').val( $(this).attr('data-left-code') );
				$('#_headForm #_chld_code').val( $(this).attr('data-code') );
				$('#_headForm').attr('action' , $(this).attr('data-url')).submit();
			});
			
			/***********************************************************************
			footer
			***********************************************************************/
			
			$('.setting_layer').bind('click' , function() {
				$('.setting_layer').show();
			})
			
			$('#logOutBtn').bind ('click' , function() {
				if (confirm('로그아웃 하시겠습니까?')) {
					gfn_setAutoDomainCookie('L_MNU_ID' ,"", 3600);		// 왼쪽메뉴 쿠키 삭제 
					location.href = '/mngr/log/logout.do';
				}
			});
		});
		
		/** 관리자 로그인 여부 체크  24.06.23 추가 */
		var gfn_isSessionValid = function(sessionSe) {
			gfn_simpleAjax('/common/session/isSessionValid.do' , { sessionSe : sessionSe } , function(resp) {
				if ( !resp.result ) {	/** 로그인이 되지 않았다면 .. */
					alert(resp.message);
					location.href = resp.value;
					return;
				}
			})
		}

		/**
		 * ajax 간소화 처리
		 * ajaxUrl : 통신 url 
		 * ajaxData : json parameter 
		 * ajaxCallback : callback 함수 
		 */
		var gfn_simpleAjax = function (ajaxUrl , ajaxData , ajaxCallback) {
			
		    $.ajax({
		        url : ajaxUrl,
		        type : "post",
		        data : ajaxData,
		        dataType : "json",
		        success : function(response) {
		        	
		        	const responseValue = gfn_jsonMsg (response)
		        	
		            if(ajaxCallback) {
		                ajaxCallback(responseValue);
		            }
		        },
		        error : function(request, status, error) {
		        	alert('에러가 발생하였습니다\ncode='+error);
		            return;
		        }
		    });
		}
	</script>

</config>
