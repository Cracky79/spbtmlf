<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<th:block th:fragment="sidebarFragment">
    
	<ul class="lnb_area">
		
		<!-- 세션에 담긴 left 에 해당하는 메뉴만 처리 한다.  -->
		<th:block th:each = "chlds ,v2 : ${session.FULL_MENU_LIST}">	<!-- 1 each -->
			
	   		<th:block th:if = "${session._menu_code eq chlds.upper_code}">
	   	   		
	   	   		<!-- 하위 메뉴가 있는 경우 처리  25.06.24-->
	   	   		<th:block th:with ="l_flag = ${chlds.chld_count ne '0'} , HY_SUB=${l_flag == true ? 'hy-sub' : ''}"/>
	   	   		<th:block th:with ="l_flag_s = ${chlds.menu_code eq session._left_code} , MENU_ON=${l_flag_s == true ? 'on' : ''} , MENU_SELECTED=${l_flag_s == true ? 'selected' : ''}"/>
	   	   		
	   	   		
	   	   		<li class="" th:classappend="${HY_SUB == null ? '' : HY_SUB}+${MENU_ON == null ? '' : MENU_ON}+${MENU_SELECTED == null ? '' : MENU_SELECTED}">
		           <a href="#" class="deth1" 
		                       th:data-upper-code='${chlds.upper_code}' 
		                       th:data-url = '${chlds.menu_url}' 
		                       th:data-code='${chlds.menu_code}'>
		               <span th:text="${chlds.menu_code_nm}">메뉴명</span>
		           </a>
		           
			        <!-- 하위 메뉴 depth2 가 있는 경우 추가 처리 25.06.24 -->   
					<th:block th:if = "${l_flag == true}">        	
		           		<!-- depth2 on off 처리 추가  -->
	   	   				<th:block th:with ="s_flag = ${chlds.menu_code eq session._left_code} , S_MENU_ON=${s_flag == true ? 'on' : ''} , MENU_SELECTED = ${s_flag == true ? 'selected' : ''}"/>
		           
		           
		           		<ul class="deth2 ${MENU_ON}" th:appendclass="${S_MENU_ON}">
		           		
							<th:block th:each = "child2 ,v2 : ${session.FULL_MENU_LIST}">	
								<!-- 세부 메뉴 처리 -->
							    <th:block th:with ="s_flag2 = ${child2.menu_code eq session._chld_code} , S_MENU_ON2=${s_flag2 == true ? 'on' : ''} , MENU_SELECTED2 = ${s_flag2 == true ? 'selected' : ''}"/>
								
								<th:block th:if = "${s_flag2 == true}">
									<li>
										<a href="#" class="deth2"
										            th:classappend="${S_MENU_ON2}+${MENU_SELECTED2}" 
										            th:data-upper-code='${sessionScope._menu_code}' 
													th:data-left-code='${child2.upper_code}' 
													th:data-url = '${child2.menu_url}' 
													data-code='${child2.menu_code}'>
											<span th:text="${child2.menu_code_nm}">세부메뉴명</span>
										</a>
									</li>
								</th:block>
								
							</th:block>
						</ul>
		           	</th:block>
	   	   		</li>
	   	    </th:block>	
		
		</th:block>	<!-- 1 each end-->
	</ul>
</th:block>
